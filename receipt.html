<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS - Recibo de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="receipt-page.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html">Sistema POS</a>
        </div>
    </nav>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <div class="col-lg-6 d-flex flex-column align-items-center justify-content-center p-4">
                <div style="width: 100%; max-width: 500px;">
                    <div class="alert alert-success" role="alert">
                        <h4 class="alert-heading text-uppercase"><i class="bi bi-check-circle-fill"></i> ¡Pago Exitoso!</h4>
                        <p class="display-6 fw-bold" id="successful-payment-total">$0</p>
                    </div>
                    <button class="btn btn-secondary w-100 py-3 mt-3" id="print-receipt-btn">
                        <i class="bi bi-printer-fill me-2"></i>Imprimir Recibo
                    </button>
                    <a href="index.html" class="btn btn-dark w-100 py-3 mt-4">
                        <i class="bi bi-plus-circle me-2"></i>Nueva Orden
                    </a>
                </div>
            </div>

            <div class="col-lg-6 receipt-preview-column">
                <div id="receipt-preview-wrapper">
                    <div id="receipt-preview">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center text-lg-start">
        <div class="d-flex justify-content-center align-items-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            <span class="footer-text">Creado por JUNGLE ONE SAS</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="receipt-script.js"></script>
</body>
</html>
